[platformio]
src_dir = .
default_envs = esp32s3dev

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
extra_scripts = pre:scripts/generate_version.py

build_flags =
  -std=c++17
  -Wall
  -Wextra
  -Werror=return-type
  -Iinclude
  -Iexamples
  -DCORE_DEBUG_LEVEL=0
  -DLOG_LEVEL=2
build_src_filter =
  -<*>
  +<examples/01_basic_bringup_cli/**>
  +<src/**>

; -------------------------
; ESP32-S3 dev config
; -------------------------
[env:esp32s3dev]
board = esp32-s3-devkitc-1
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600
debug_tool = esp-prog
debug_init_break = tbreak setup
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; -------------------------
; ESP32-S2 dev config
; -------------------------
[env:esp32s2dev]
board = esp32-s2-saola-1
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600
debug_tool = esp-prog
debug_init_break = tbreak setup
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_upload.after_reset = no-reset-stub
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1

; -------------------------
; Native host tests
; -------------------------
[env:native]
platform = native@1.2.1
framework =
lib_deps =
test_framework = unity
test_build_src = true
build_src_filter =
  -<*>
  +<src/**>
build_flags =
  -std=c++17
  -Iinclude
  -Iexamples
  -Itest/stubs
extra_scripts = pre:scripts/generate_version.py

; Native suite with memory and undefined-behavior instrumentation.
; Kept separate so embedded target flags and normal host diagnostics are
; unchanged.
[env:native_sanitized]
extends = env:native
build_flags =
  ${env:native.build_flags}
  -O1
  -g
  -fno-omit-frame-pointer
  -fno-sanitize-recover=all
  -fsanitize=address,undefined
